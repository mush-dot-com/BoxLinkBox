name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        shell: pwsh
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - name: Select Rust
        run: rustup override set 1.96.0
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Verify and build
        shell: powershell
        run: .\build.ps1 -Task all
