[package]
name = "boxlinkbox"
version = "1.0.0"
edition = "2024"
license = "MIT"
rust-version = "1.96"
description = "グループで整理するアプリ内ブラウザ"

[dependencies]
tao = "0.37"
wry = "0.57"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
url = "2"
rfd = "0.17"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
